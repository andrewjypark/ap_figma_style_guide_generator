<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Inter, sans-serif;
      margin: 0;
      padding: 16px;
      color: #1a1a1a;
    }
    h2 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 4px;
    }
    p {
      font-size: 11px;
      color: #666;
      margin: 0 0 12px;
      line-height: 1.4;
    }
    #collections {
      border: 1px solid #e6e6e6;
      border-radius: 6px;
      margin-bottom: 12px;
      max-height: 280px;
      overflow-y: auto;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .row:not(:last-child) {
      border-bottom: 1px solid #f0f0f0;
    }
    #select-all-row {
      font-weight: 600;
      background: #fafafa;
      border-bottom: 1px solid #e6e6e6;
    }
    .row input[type="checkbox"] {
      width: 14px;
      height: 14px;
      cursor: pointer;
    }
    .empty {
      padding: 12px 10px;
      font-size: 11px;
      color: #999;
    }
    button {
      width: 100%;
      background: #18a0fb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #0d8ee0;
    }
    button:disabled {
      background: #b8dffb;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 11px;
      line-height: 1.4;
    }
    #status.success { color: #1a7f37; }
    #status.error { color: #c0362c; }
  </style>
</head>
<body>
  <h2>Style Guide Generator</h2>
  <p>Generates a Section per selected collection on the Style Guide page &mdash; a "Colors" Section for its color variables, a "Tokens" Section for everything else. Re-running replaces each collection's previous Sections.</p>

  <div id="collections">
    <div class="empty">Loading collections&hellip;</div>
  </div>

  <button id="generate" disabled>Generate</button>
  <div id="status"></div>

  <script>
    const collectionsEl = document.getElementById('collections');
    const generateBtn = document.getElementById('generate');
    const statusEl = document.getElementById('status');

    let names = null;
    let checked = new Set();

    function render() {
      if (names === null) {
        collectionsEl.innerHTML = '<div class="empty">Loading collections&hellip;</div>';
        generateBtn.disabled = true;
        return;
      }
      if (!names.length) {
        collectionsEl.innerHTML = '<div class="empty">No local variable collections found in this file.</div>';
        generateBtn.disabled = true;
        return;
      }

      collectionsEl.innerHTML = '';

      const selectAllRow = document.createElement('label');
      selectAllRow.id = 'select-all-row';
      selectAllRow.className = 'row';
      const selectAllCheckbox = document.createElement('input');
      selectAllCheckbox.type = 'checkbox';
      selectAllRow.appendChild(selectAllCheckbox);
      selectAllRow.appendChild(document.createTextNode('Select all'));
      collectionsEl.appendChild(selectAllRow);

      const itemCheckboxes = [];
      for (const name of names) {
        const row = document.createElement('label');
        row.className = 'row';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = checked.has(name);
        cb.dataset.name = name;
        itemCheckboxes.push(cb);
        row.appendChild(cb);
        row.appendChild(document.createTextNode(name));
        collectionsEl.appendChild(row);
      }

      function updateSelectAllState() {
        const checkedCount = itemCheckboxes.filter((cb) => cb.checked).length;
        selectAllCheckbox.checked = checkedCount === itemCheckboxes.length;
        selectAllCheckbox.indeterminate = checkedCount > 0 && checkedCount < itemCheckboxes.length;
        generateBtn.disabled = checkedCount === 0;
        checked = new Set(itemCheckboxes.filter((cb) => cb.checked).map((cb) => cb.dataset.name));
      }

      selectAllCheckbox.onchange = () => {
        for (const cb of itemCheckboxes) cb.checked = selectAllCheckbox.checked;
        updateSelectAllState();
      };
      for (const cb of itemCheckboxes) {
        cb.onchange = updateSelectAllState;
      }

      generateBtn.onclick = () => {
        const selected = itemCheckboxes.filter((cb) => cb.checked).map((cb) => cb.dataset.name);
        statusEl.className = '';
        statusEl.textContent = 'Generating…';
        parent.postMessage({ pluginMessage: { type: 'generate', collectionNames: selected } }, '*');
      };

      updateSelectAllState();
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'collections') {
        names = msg.names;
        checked = new Set(msg.names);
        render();
      } else if (msg.type === 'success' || msg.type === 'error') {
        statusEl.className = msg.type;
        statusEl.textContent = msg.message;
      }
    };

    render();
    parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*');
  </script>
</body>
</html>
